services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payback
      POSTGRES_USER: payback
      POSTGRES_PASSWORD: payback_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-payback-secret-change-in-production}
      - DATABASE_URL=postgresql://payback:payback_secret@db:5432/payback
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
